version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis_container
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    ports:
      - "8800:8800"
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: uvicorn agent_graphs:app --host 0.0.0.0 --port 8800
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celery_worker
    command: celery -A agent_graphs.celery_app worker --loglevel=info -P solo
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - backend
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs_frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8800
    restart: always
