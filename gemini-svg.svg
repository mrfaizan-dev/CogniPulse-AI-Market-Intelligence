<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Play Button Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2a2a" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>
  </defs>

  <!-- Modern Tech Card Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="1184" height="384" rx="12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />

  <!-- Decorative Tech Grid Overlay -->
  <path d="M0,100 L1200,100 M0,200 L1200,200 M0,300 L1200,300" stroke="#1e293b" stroke-width="1" stroke-dasharray="5,5" />
  <path d="M300,0 L300,400 M600,0 L600,400 M900,0 L900,400" stroke="#1e293b" stroke-width="1" stroke-dasharray="5,5" />

  <!-- Top Badge: LIVE WORKING PROJECT -->
  <rect x="420" y="45" width="360" height="44" rx="22" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="445" cy="67" r="6" fill="#22c55e" />
  <text x="465" y="74" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">LIVE WORKING PROJECT</text>

  <!-- Main Title -->
  <text x="600" y="150" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="1">CogniPulse Autonomous AI Demo</text>

  <!-- Subtitle -->
  <text x="600" y="190" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="18" font-weight="500">End-to-End Execution & Architecture Walkthrough</text>

  <!-- Central Play Button Container -->
  <g transform="translate(540, 230)">
    <!-- Outer Glow Ring -->
    <rect x="-10" y="-10" width="140" height="90" rx="24" fill="#ff0000" opacity="0.4" filter="url(#glow)" />
    <!-- YouTube Red Button -->
    <rect width="120" height="74" rx="16" fill="url(#playGrad)" />
    <!-- White Play Triangle -->
    <polygon points="48,22 48,52 78,37" fill="#ffffff" />
  </g>

  <!-- Bottom Action Prompt -->
  <text x="600" y="355" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="15" font-weight="600">▶ Click anywhere on banner to watch full HD video</text>
</svg>