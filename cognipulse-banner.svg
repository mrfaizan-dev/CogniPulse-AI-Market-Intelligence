<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">CogniPulse Autonomous AI Demo</title>
  <desc id="d">Live working project banner. Click to watch the full HD video walkthrough.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a18"/>
      <stop offset="0.5" stop-color="#0d1426"/>
      <stop offset="1" stop-color="#0a1022"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#d40000"/>
    </linearGradient>

    <radialGradient id="orbBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>

    <clipPath id="card"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>

  <a xlink:href="YOUR_VIDEO_LINK_HERE" href="YOUR_VIDEO_LINK_HERE" target="_blank">
    <g clip-path="url(#card)" text-rendering="geometricPrecision" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

      <!-- Background -->
      <rect width="1200" height="400" fill="url(#bg)"/>
      <rect width="1200" height="400" fill="url(#grid)"/>
      <circle cx="140" cy="60" r="260" fill="url(#orbBlue)"/>
      <circle cx="1080" cy="350" r="280" fill="url(#orbPurple)"/>

      <!-- Border -->
      <rect x="4" y="4" width="1192" height="392" rx="18" fill="none" stroke="url(#border)" stroke-width="2.5" stroke-opacity="0.85"/>

      <!-- Corner accents -->
      <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
        <path d="M28 52 V34 Q28 28 34 28 H52"/>
        <path d="M1172 52 V34 Q1172 28 1166 28 H1148"/>
        <path d="M28 348 V366 Q28 372 34 372 H52"/>
        <path d="M1172 348 V366 Q1172 372 1166 372 H1148"/>
      </g>

      <!-- Live badge -->
      <rect x="440" y="40" width="320" height="42" rx="21" fill="#0284c7" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="468" cy="61" r="9" fill="#22c55e" opacity="0.3"/>
      <circle cx="468" cy="61" r="5.5" fill="#22c55e"/>
      <text x="490" y="67" fill="#7dd3fc" font-size="15" font-weight="700" letter-spacing="2.5">LIVE WORKING PROJECT</text>

      <!-- Title -->
      <text x="600" y="143" text-anchor="middle" fill="url(#title)" font-size="46" font-weight="800" letter-spacing="1">CogniPulse Autonomous AI Demo</text>
      <rect x="520" y="156" width="160" height="3" rx="1.5" fill="url(#border)"/>

      <!-- Subtitle -->
      <text x="600" y="190" text-anchor="middle" fill="#a8b6cc" font-size="18" font-weight="500" letter-spacing="0.5">End-to-End Execution &amp; Architecture Walkthrough</text>

      <!-- Play button -->
      <g transform="translate(540 218)">
        <rect x="-6" y="-2" width="132" height="86" rx="26" fill="#ff1a1a" opacity="0.55" filter="url(#glow)"/>
        <g filter="url(#shadow)">
          <rect width="120" height="78" rx="20" fill="url(#play)"/>
          <rect x="1" y="1" width="118" height="76" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
          <path d="M48 22 L48 56 L80 39 Z" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Footer call-to-action -->
      <text x="600" y="342" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600" letter-spacing="0.5">▶  Click anywhere on banner to watch full HD video</text>
      <text x="600" y="368" text-anchor="middle" fill="#64748b" font-size="12" font-weight="500" letter-spacing="3">AUTONOMOUS  •  AGENTIC  •  PRODUCTION-READY</text>
    </g>
  </a>
</svg>
